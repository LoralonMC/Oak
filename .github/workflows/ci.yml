name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the bot container (ghcr.io/parkervcp/yolks:python_3.10).
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # Catches import errors and syntax mistakes across every module, including
      # ones no test imports. A missing import once reached production this way.
      - name: Byte-compile everything
        run: python -m compileall -q oak branches bot.py create_branch.py

      - name: Run tests
        run: pytest -q
